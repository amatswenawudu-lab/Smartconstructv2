name: Build Smart Construct APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          unzip -o "*.zip" -d extracted
          mv extracted/*/* . 2>/dev/null || mv extracted/*/*/* . 2>/dev/null || mv extracted/* . 2>/dev/null || true
          ls -la
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Make gradlew executable
        run: chmod +x gradlew || echo "no gradlew"
      - name: Build APK
        run: ./gradlew assembleDebug || gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SmartConstruct-APK
          path: app/build/outputs/apk/debug/app-debug.apk
